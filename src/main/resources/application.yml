spring:
  application:
    name: be-interview-prep
  datasource:
    url: jdbc:h2:mem:interviewprep;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

app:
  short-link:
    base-url: ${SHORT_LINK_BASE_URL:http://localhost:8080}
