[extend]
useDefault = true

[allowlist]
description = "Repo-wide false-positive allowlist."
paths = [
  '''\.env\.(example|sample|template)$''',
  '''^\.gitleaks\.toml$''',
  '''^\.claude/hooks/block-secrets\.cjs$''',
  # Project-specific
  '''^src/test/resources/application\.ya?ml$''',
  '''^\.claude/harness/hashes\.json$''',
]

regexTarget = "line"

regexes = [
  '''=\s*"REPLACE_ME"''',
]
